[project]
name = "knot-backend"
version = "0.1.0"
description = "KNOT API, agent services, and blockchain/payment backend (pay.sh/x402 + Anchor escrow)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "google-cloud-firestore>=2.21.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "google-genai>=1.0.0",
  "anchorpy>=0.20",
  "solana>=0.34",
  "solders>=0.21"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.12.0",
  "mypy>=1.16.0"
]

[build-system]
requires = ["setuptools>=78.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "libs*", "knot*"]
exclude = ["fixtures*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# anchorpy ships a pytest plugin that imports the removed `pytest_xprocess`
# module; we don't use its localnet fixtures, so disable it.
addopts = "-p no:pytest_anchorpy"
markers = [
    "integration: pay.sh/네트워크 필요",
    "devnet: 배포된 프로그램 + 펀딩된 지갑 필요 (KNOT_RUN_DEVNET=1)",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps", "libs"]
