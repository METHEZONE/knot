[project]
name = "knot-backend"
version = "0.1.0"
description = "knot 블록체인 백엔드 — pay.sh/x402 결제 + Anchor 에스크로 클라이언트"
requires-python = ">=3.9"
dependencies = [
    "anchorpy>=0.20",
    "solana>=0.34",
    "solders>=0.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["knot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: pay.sh/네트워크 필요",
    "devnet: 배포된 프로그램 + 펀딩된 지갑 필요 (KNOT_RUN_DEVNET=1)",
]
